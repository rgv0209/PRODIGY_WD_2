<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Gradient Stopwatch</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stopwatch-container">
    
    <div class="half-circle-wrapper">
      <div class="gradient-half-circle"></div>
      <div class="time-display" id="display">00:00:00.<span class="ms">00</span></div>
    </div>

    <div class="controls">
      <button id="startPauseBtn" class="btn start">Start</button>
      <button id="lapBtn" class="btn lap" disabled>Lap</button>
      <button id="resetBtn" class="btn reset">Reset</button>
    </div>

    <div class="laps-container">
      <ul id="lapsList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
